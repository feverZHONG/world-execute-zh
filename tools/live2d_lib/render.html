<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Live2D plate</title>
<style>html,body{margin:0;background:transparent;overflow:hidden}</style>
</head>
<body>
<script src="./live2dcubismcore.min.js"></script>
<script src="./pixi.min.js"></script>
<script src="./pixi-live2d-display.min.js"></script>
<script>
/* 用 query 把一个 moc3 渲成透明 PNG。参数：
 *   ?model=/assets/live2d/l2d16.u/l2d16.u.model3.json&w=4096&h=4096
 *   &pad=0.94      角色占画布的比例
 *   &zoom=1.3&ox=0&oy=0   在 pad 之上再放大 / 平移（输出 px）
 *   &motion=motions/Mgirl02_stand.motion3.json&t=0.5   把某条 motion 定格在第 t 秒后套用
 *   &params=ParamAngleX:12,ParamAngleY:-8                再叠一层手调参数
 *   &dump=1        把参数名与当前值放进 __LOG__
 * 渲染完 canvas 留在页面上，由 Node 侧 toDataURL 取走。
 */
const Q = new URLSearchParams(location.search);
const W = parseInt(Q.get('w') || '2048', 10);
const H = parseInt(Q.get('h') || '2048', 10);
const PAD = parseFloat(Q.get('pad') || '0.94');
const ZOOM = parseFloat(Q.get('zoom') || '1');
const OX = parseFloat(Q.get('ox') || '0');
const OY = parseFloat(Q.get('oy') || '0');
const MODEL = Q.get('model');
const BOX = Q.get('box');                                     // 模型坐标里的取材框 x,y,w,h（y 向下）→ 直接渲成整张图，不用再裁
const MOTION = Q.get('motion');
const TIME = parseFloat(Q.get('t') || '0');
const PARAMS = Q.get('params') || '';
const DUMP = Q.get('dump') === '1';
window.__LOG__ = [];

/* motion3：Segments = 0, t0, v0, 然后每个 (type, t, v[, c1t, c1v, c2t, c2v]) */
function motionValue(seg, t) {
  if (typeof seg[0] !== 'number') return null;
  let pt = seg[1], pv = seg[2], i = 3;
  if (t <= pt) return pv;
  while (i < seg.length) {
    const type = seg[i];
    if (type === 1) {                                        // 贝塞尔：先解时间，再取值
      const c1t = seg[i + 3], c1v = seg[i + 4], c2t = seg[i + 5], c2v = seg[i + 6], t1 = seg[i + 7], v1 = seg[i + 8];
      if (t <= t1) {
        let lo = 0, hi = 1;
        for (let k = 0; k < 24; k++) {                       // 时间轴上的二分
          const u = (lo + hi) / 2, it = 1 - u;
          const xt = it * it * it * pt + 3 * it * it * u * c1t + 3 * it * u * u * c2t + u * u * u * t1;
          if (xt < t) lo = u; else hi = u;
        }
        const u = (lo + hi) / 2, it = 1 - u;
        return it * it * it * pv + 3 * it * it * u * c1v + 3 * it * u * u * c2v + u * u * u * v1;
      }
      pt = t1; pv = v1; i += 9; continue;
    }
    const t1 = seg[i + 1], v1 = seg[i + 2];                  // linear(0) / stepped(2) / inverse-stepped(3)
    if (t <= t1) return type === 0 ? pv + (v1 - pv) * (t1 === pt ? 0 : (t - pt) / (t1 - pt)) : pv;
    pt = t1; pv = v1; i += 3;
  }
  return pv;
}

(async () => {
  try {
    if (!MODEL) throw new Error('缺少 ?model=');
    const app = new PIXI.Application({
      width: W, height: H, backgroundAlpha: 0, preserveDrawingBuffer: true,
      antialias: true, resolution: 1, powerPreference: 'high-performance',
    });
    document.body.appendChild(app.view);

    const model = await PIXI.live2d.Live2DModel.from(MODEL, { autoInteract: false, autoUpdate: false });
    app.stage.addChild(model);

    const mw = model.width, mh = model.height;               // 缩放前的模型画布尺寸（model.width 会跟着 scale 变，必须先存）
    const s = Math.min(W / mw, H / mh) * PAD * ZOOM;
    model.scale.set(s);
    model.anchor.set(0.5, 0.5);                              // Cubism 画布原点在中心、y 轴向上
    model.x = W / 2 + OX;
    model.y = H / 2 + OY;
    if (BOX) {
      // 直接把模型坐标里的取材框铺满画布：s 由框算，位置由框心对画布中心算 —— 出图即成品，不再二次裁放
      const [bx, by, bw, bh] = BOX.split(',').map(Number);
      const bs = Math.min(W / bw, H / bh) * ZOOM;
      model.scale.set(bs);
      model.x = W / 2 - (bx + bw / 2 - mw / 2) * bs;
      model.y = H / 2 - (by + bh / 2 - mh / 2) * bs;
      window.__LOG__.push(`box ${bx},${by},${bw},${bh} @${(bs * 100).toFixed(1)}%`);
    }
    window.__LOG__.push(`canvas ${mw.toFixed(0)}x${mh.toFixed(0)} @${(model.scale.x * 100).toFixed(1)}%`);

    const core = model.internalModel.coreModel;
    try { model.internalModel.motionManager.stopAllMotions(); } catch {}

    if (MOTION) {
      const rel = new URL(MOTION, new URL(MODEL, location.href)).href;
      const data = await (await fetch(rel)).json();
      let n = 0;
      for (const c of data.Curves) {
        if (c.Target !== 'Parameter' || !c.Id) continue;
        const v = motionValue(c.Segments, TIME);
        if (v === null || !isFinite(v)) continue;
        core.setParameterValueById(c.Id, v); n++;
      }
      window.__LOG__.push(`motion ${MOTION} @${TIME}s → ${n} params`);
    }
    for (const tok of PARAMS.split(',')) {
      const [k, v] = tok.split(':');
      if (!k) continue;
      core.setParameterValueById(k.trim(), parseFloat(v));
    }

    if (DUMP) {
      const raw = core._model || core;
      const proto = Object.getOwnPropertyNames(Object.getPrototypeOf(core)).join(',');
      const own = Object.keys(core).join(',');
      const rp = Object.getOwnPropertyNames(Object.getPrototypeOf(raw)).filter((n) => /Param|parameter/i.test(n)).join(',');
      window.__LOG__.push(`API core[${own}] proto[${proto}]`);
      window.__LOG__.push(`API raw.param[${rp}]`);
      const ids = (raw.parameters || raw._parameters || {}).ids;
      const vals = (raw.parameters || raw._parameters || {}).values;
      if (ids && vals) {
        const out = [];
        for (let i = 0; i < ids.length; i++) out.push(`${ids[i]}=${vals[i].toFixed(2)}`);
        window.__LOG__.push('PARAMS ' + out.join(' '));
      } else window.__LOG__.push('PARAMS (参数表拿不到)');
    }

    core.update();                                           // 让变形体跟上我们刚设的参数
    app.renderer.render(app.stage);
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    app.renderer.render(app.stage);
    window.__READY__ = true;
  } catch (e) {
    window.__ERR__ = String((e && e.stack) || e);
  }
})();
</script>
</body>
</html>
